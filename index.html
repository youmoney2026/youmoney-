<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You Money</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #e0e0e0; margin: 0; padding: 0; padding-bottom: 30px; }
        .header { background-color: #ff0000; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .title { font-size: 18px; font-weight: bold; color: white; }
        .wallet { background-color: #1e1e1e; color: #4caf50; padding: 5px 10px; border-radius: 4px; font-weight: bold; border: 1px solid #4caf50; }
        .container { padding: 15px; }
        .section { background-color: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #333; }
        .label { font-size: 14px; margin-bottom: 10px; display: block; }
        input { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 4px; border: 1px solid #444; background-color: #2a2a2a; color: #fff; box-sizing: border-box; }
        button { background-color: #ff0000; color: white; border: none; padding: 10px; border-radius: 4px; font-weight: bold; cursor: pointer; width: 100%; }
        .video-box { background-color: #000; width: 100%; padding-bottom: 56.25%; position: relative; margin-bottom: 10px; }
        #main-player { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .playlist-item { background-color: #252525; padding: 10px; margin-bottom: 8px; border-radius: 4px; cursor: pointer; display: flex; justify-content: space-between; }
        .status { margin-top: 10px; font-weight: bold; }
        .success { color: #4caf50; display: none; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="title">YOU MONEY</div>
        <div class="wallet">₹ <span id="balance">0.00</span></div>
    </div>

    <div class="container">
        <div class="section">
            <span class="label">वीडियो सर्च करें या लिंक पेस्ट करें:</span>
            <input type="text" id="url-input" placeholder="यूट्यूब लिंक यहाँ पेस्ट करें...">
            <button onclick="searchVideo()">सर्च करें</button>
        </div>

        <div class="section">
            <div class="video-box"><div id="main-player"></div></div>
            <div id="status" class="status">वीडियो पूरा देखें...</div>
            <div id="success" class="success">सफलता: ₹0.01 वॉलेट में जोड़ दिए गए!</div>
        </div>

        <div class="section">
            <div class="label">क्रिएटर वीडियो अपलोड करें:</div>
            <input type="text" id="c-title" placeholder="वीडियो टाइटल">
            <input type="text" id="c-url" placeholder="यूट्यूब लिंक">
            <button onclick="addCreatorVideo()">लिस्ट में जोड़ें</button>
        </div>

        <div class="label">वीडियो लिस्ट:</div>
        <div id="playlist"></div>
    </div>

    <script>
        let balance = 0.00;
        let player;
        let watched = {};

        const defaultVids = [
            { id: 'tgbNymZ7vqY', title: 'मजेदार कार्टून वीडियो' },
            { id: 'dQw4w9WgXcQ', title: 'म्यूजिक वीडियो' },
            { id: '9bZkp7q19f0', title: 'अनोखे फैक्ट्स' },
            { id: 'NJuSStkIZBg', title: 'लाइफ हैक्स' }
        ];

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('main-player', { videoId: defaultVids[0].id, events: { 'onStateChange': onStateChange } });
            renderList();
        }

        function renderList() {
            const list = document.getElementById('playlist');
            list.innerHTML = '';
            defaultVids.forEach(v => {
                let div = document.createElement('div');
                div.className = 'playlist-item';
                div.innerHTML = `<span>${v.title}</span> <span>+ ₹0.01</span>`;
                div.onclick = () => loadVideo(v.id, v.title);
                list.appendChild(div);
            });
        }

        function loadVideo(id, title) {
            player.loadVideoById(id);
            document.getElementById('status').style.display = 'block';
            document.getElementById('success').style.display = 'none';
        }

        function searchVideo() {
            let url = document.getElementById('url-input').value;
            let id = url.split('v=')[1] || url.split('/').pop();
            if(id) loadVideo(id, "सर्च किया गया वीडियो");
        }

        function addCreatorVideo() {
            let t = document.getElementById('c-title').value;
            let u = document.getElementById('c-url').value;
            let id = u.split('v=')[1] || u.split('/').pop();
            if(t && id) {
                defaultVids.unshift({id: id, title: t});
                renderList();
            }
        }

        function onStateChange(e) {
            if (e.data == 0) {
                let id = player.getVideoData().video_id;
                if (!watched[id]) {
                    watched[id] = true;
                    balance += 0.01;
                    document.getElementById('balance').innerText = balance.toFixed(2);
                    document.getElementById('success').style.display = 'block';
                    document.getElementById('status').style.display = 'none';
                }
            }
        }

        let tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        document.head.appendChild(tag);
    </script>
</body>
</html>
