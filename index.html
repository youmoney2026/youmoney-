<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You Money - Creator Hub</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 0;
            padding-bottom: 30px;
        }
        .header-container {
            background-color: #ff0000;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .app-title {
            font-size: 16px;
            font-weight: bold;
            color: white;
            margin-left: 10px;
        }
        .wallet-small {
            background-color: #1e1e1e;
            color: #4caf50;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
            border: 1px solid #4caf50;
            margin-right: 10px;
        }
        .container {
            padding: 10px;
        }
        .box-container {
            background-color: #1e1e1e;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            border: 1px solid #333;
        }
        .box-title {
            font-size: 13px;
            color: #fff;
            margin: 0 0 8px 0;
            font-weight: bold;
        }
        .input-field {
            width: 100%;
            padding: 8px;
            margin-bottom: 8px;
            border-radius: 4px;
            border: 1px solid #444;
            background-color: #2a2a2a;
            color: #fff;
            font-size: 12px;
            box-sizing: border-box;
        }
        .action-btn {
            background-color: #ff0000;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            width: 100%;
        }
        .video-card {
            background-color: #1e1e1e;
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
        }
        .video-title {
            font-size: 13px;
            margin: 0 0 8px 0;
            color: #ffffff;
            text-align: left;
            font-weight: bold;
        }
        .video-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            height: 0;
            background-color: #000;
            border-radius: 4px;
            overflow: hidden;
        }
        .video-wrapper div {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .status-text {
            font-size: 12px;
            color: #ff9800;
            margin-top: 10px;
            font-weight: bold;
        }
        .success-text {
            font-size: 13px;
            color: #4caf50;
            margin-top: 10px;
            font-weight: bold;
            display: none;
        }
        .playlist-container {
            background-color: #1e1e1e;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #333;
        }
        .playlist-title {
            font-size: 14px;
            color: #fff;
            margin: 0 0 10px 0;
            font-weight: bold;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
        }
        .playlist-item {
            display: flex;
            align-items: center;
            background-color: #252525;
            padding: 8px;
            margin-bottom: 8px;
            border-radius: 4px;
            cursor: pointer;
            border: 1px solid transparent;
        }
        .playlist-item:hover {
            border-color: #ff0000;
            background-color: #2a2a2a;
        }
        .playlist-icon {
            font-size: 14px;
            margin-right: 10px;
            color: #ff0000;
        }
        .playlist-text {
            font-size: 12px;
            color: #e0e0e0;
            flex: 1;
        }
        .badge-uploaded {
            font-size: 10px;
            background-color: #ff0000;
            color: white;
            padding: 1px 4px;
            border-radius: 3px;
            margin-right: 5px;
            font-weight: bold;
        }
        .playlist-reward {
            font-size: 11px;
            color: #4caf50;
            font-weight: bold;
            background-color: #121212;
            padding: 2px 6px;
            border-radius: 3px;
        }
    </style>
</head>
<body>

    <div class="header-container">
        <div class="app-title">YOU MONEY</div>
        <div class="wallet-small">INR <span id="money-display">0.00</span></div>
    </div>

    <div class="container">
        
        <div class="box-container">
            <p class="box-title">यूट्यूब वीडियो लिंक सर्च करें (पुराने या नए वीडियो)</p>
            <input type="text" id="search-url" class="input-field" placeholder="यहाँ वीडियो लिंक पेस्ट करें...">
            <button class="action-btn" onclick="searchVideoByUrl()">सर्च करें</button>
        </div>

        <div class="box-container">
            <p class="box-title">क्रिएटर ज़ोन: अपना वीडियो प्रमोट करें</p>
            <input type="text" id="upload-title" class="input-field" placeholder="वीडियो का नाम या टाइटल लिखें...">
            <input type="text" id="upload-url" class="input-field" placeholder="यूट्यूब वीडियो लिंक पेस्ट करें...">
            <button class="action-btn" onclick="uploadVideoByCreator()">वीडियो लिस्ट में जोड़ें (Upload)</button>
        </div>

        <div class="video-card">
            <p class="video-title" id="display-title">चल रहा है: वीडियो लोड हो रहा है...</p>
            <div class="video-wrapper">
                <div id="main-player"></div>
            </div>
            <div id="main-status" class="status-text">स्थिति: लोड हो रहा है...</div>
            <div id="main-success" class="success-text">सफलता: ₹0.01 आपके वॉलेट में जोड़ दिए गए हैं!</div>
        </div>

        <div class="playlist-container">
            <p class="playlist-title">वीडियो लिस्ट</p>
            <div id="dynamic-playlist"></div>
        </div>

    </div>

    <script>
        let currentBalance = 0.00;
        let currentVideoId = '';
        let watchedVideos = {}; 
        let player;

        const defaultVideos = [
            { id: 'tgbNymZ7vqY', title: 'मजेदार कार्टून शो वीडियो' },
            { id: 'dQw4w9WgXcQ', title: 'पॉपुलर म्यूजिक और डांस वीडियो' },
            { id: '9bZkp7q19f0', title: 'दुनिया के 5 सबसे गजब के फैक्ट्स' },
            { id: 'NJuSStkIZBg', title: 'शानदार लाइफ हैक्स और ट्रिक्स' },
            { id: '2Vv-BfVoq4g', title: 'गजब के साइंस एक्सपेरिमेंट' },
            { id: 'jNQXAC9IVRw', title: 'दिलचस्प जानवर और पेट्स की वीडियो' },
            { id: 'W6NZfCO5SIk', title: 'बेहतरीन स्ट्रीट फूड मेकिंग' },
            { id: 'l4r1R_S8Ysc', title: 'अनोखे गैजेट्स की अनबॉक्सिंग' },
            { id: 'f72GAs4_kzk', title: 'मजेदार कॉमेडी वाइन्स क्लिप' },
            { id: '7lsdJ_i7uBM', title: 'कुकिंग सीक्रेट्स और रेसिपी' },
            { id: 'K0u_e_S8kw0', title: 'सुंदर होम डेकोरेशनアイデア' },
            { id: 'x_7K4S2x_1A', title: 'रोचक दिमागी पहेलियाँ' }
        ];

        let creatorVideos = [];

        let tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        let firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {
            renderPlaylist();
            
            if(creatorVideos.length > 0) {
                currentVideoId = creatorVideos[0].id;
                document.getElementById('display-title').innerText = "चल रहा है: " + creatorVideos[0].title;
            } else {
                currentVideoId = document.getElementById('dynamic-playlist').children[0].getAttribute('data-id');
                let firstTitle = document.getElementById('dynamic-playlist').children[0].querySelector('.playlist-text').innerText;
                document.getElementById('display-title').innerText = "चल रहा है: " + firstTitle;
            }

            player = new YT.Player('main-player', {
                videoId: currentVideoId,
                events: {
                    'onStateChange': onPlayerStateChange
                }
            });
            
            document.getElementById('main-status').innerText = "स्थिति: वीडियो पूरा देखें...";
        }

        function renderPlaylist() {
            const playlistDiv = document.getElementById('dynamic-playlist');
            playlistDiv.innerHTML = ''; 

            creatorVideos.forEach(vid => {
                let item = document.createElement('div');
                item.className = 'playlist-item';
                item.setAttribute('data-id', vid.id);
                item.onclick = function() { selectVideo(vid.id, vid.title); };
                item.innerHTML = `<span class="playlist-icon">></span>
                                  <span class="playlist-text"><span class="badge-uploaded">NEW</span>${vid.title}</span>
                                  <span class="playlist-reward">₹0.01</span>`;
                playlistDiv.appendChild(item);
            });

            let shuffled = [...defaultVideos].sort(() => 0.5 - Math.random());
            let selectedRandom = shuffled.slice(0, 3);

            selectedRandom.forEach((vid, index) => {
                let item = document.createElement('div');
                item.className = 'playlist-item';
                item.setAttribute('data-id', vid.id);
                item.onclick = function() { selectVideo(vid.id, `वीडियो ${index + 1}: ${vid.title}`); };
                item.innerHTML = `<span class="playlist-icon">></span>
                                  <span class="playlist-text">वीडियो ${index + 1}: ${vid.title}</span>
                                  <span class="playlist-reward">₹0.01</span>`;
                playlistDiv.appendChild(item);
            });
        }

        function selectVideo(videoId, videoTitle) {
            currentVideoId = videoId;
            document.getElementById('display-title').innerText = "चल रहा है: " + videoTitle;
            
            if (watchedVideos[currentVideoId]) {
                document.getElementById('main-success').style.display = 'block';
                document.getElementById('main-status').style.display = 'none';
            } else {
                document.getElementById('main-success').style.display = 'none';
                document.getElementById('main-status').style.display = 'block';
                document.getElementById('main-status').innerText = "स्थिति: वीडियो पूरा देखें...";
                document.getElementById('main-status').style.color = "#ff9800";
            }
            
            player.loadVideoById(currentVideoId);
        }

        function extractVideoId(url) {
            let regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            let match = url.match(regExp);
            return (match && match[2].length == 11) ? match[2] : null;
        }

        // सर्च बॉक्स से किसी भी पुराने या नए वीडियो को लोड करने का फंक्शन
        function searchVideoByUrl() {
            let urlInput = document.getElementById('search-url').value.trim();
            let vId = extractVideoId(urlInput);

            if (vId) {
                document.getElementById('search-url').value = '';
                selectVideo(vId, "सर्च किया गया वीडियो");
            } else {
                alert("कृपया सही यूट्यूब वीडियो लिंक पेस्ट करें!");
            }
        }

        function uploadVideoByCreator() {
            let titleInput = document.getElementById('upload-title').value.trim();
            let urlInput = document.getElementById('upload-url').value.trim();
            let vId = extractVideoId(urlInput);

            if (!titleInput) {
                alert("कृपया वीडियो का नाम या टाइटल लिखें!");
                return;
            }
            if (!vId) {
                alert("कृपया सही यूट्यूब वीडियो लिंक पेस्ट करें!");
                return;
            }

            creatorVideos.unshift({ id: vId, title: titleInput });
            
            document.getElementById('upload-title').value = '';
            document.getElementById('upload-url').value = '';
            
            renderPlaylist();
            alert("आपका वीडियो लिस्ट में सबसे ऊपर जोड़ दिया गया है।");
            
            selectVideo(vId, titleInput);
        }

        function onPlayerStateChange(event) {
            let statusElement = document.getElementById('main-status');
            
            if (event.data == YT.PlayerState.PLAYING) {
                statusElement.innerText = "स्थिति: वीडियो चल रहा है... (पूरा देखना ज़रूरी है)";
                statusElement.style.color = "#4caf50";
            } 
            else if (event.data == YT.PlayerState.PAUSED) {
                statusElement.innerText = "स्थिति: वीडियो रुका हुआ है! देखने पर ही पैसा मिलेगा।";
                statusElement.style.color = "#ff9800";
            } 
            else if (event.data == YT.PlayerState.ENDED) {
                statusElement.style.display = 'none';
                
                if (!watchedVideos[currentVideoId]) {
                    watchedVideos[currentVideoId] = true;
                    currentBalance += 0.01;
                    document.getElementById('money-display').innerText = currentBalance.toFixed(2);
                    document.getElementById('main-success').style.display = 'block';
                }
            }
        }
    </script>
</body>
</html>
