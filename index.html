<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You Money - Search & Watch</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 0;
            padding-bottom: 60px;
        }
        .header-container {
            background-color: #ff0000;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .app-title {
            font-size: 16px;
            font-weight: bold;
            color: white;
            margin-left: 10px;
        }
        .wallet-small {
            background-color: #1e1e1e;
            color: #4caf50;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
            border: 1px solid #4caf50;
            margin-right: 10px;
        }
        .container {
            padding: 10px;
        }
        /* सर्च बॉक्स स्टाइल */
        .search-box-container {
            background-color: #1e1e1e;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            border: 1px solid #333;
        }
        .search-title {
            font-size: 13px;
            color: #fff;
            margin: 0 0 8px 0;
            font-weight: bold;
        }
        .search-row {
            display: flex;
            gap: 8px;
        }
        .search-input {
            flex: 1;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #444;
            background-color: #2a2a2a;
            color: #fff;
            font-size: 12px;
        }
        .search-btn {
            background-color: #ff0000;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
        }
        .video-card {
            background-color: #1e1e1e;
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
        }
        .video-title {
            font-size: 12px;
            margin: 0 0 8px 0;
            color: #ffffff;
            text-align: left;
        }
        .video-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            height: 0;
            background-color: #000;
            border-radius: 4px;
            overflow: hidden;
        }
        .video-wrapper div {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .status-text {
            font-size: 11px;
            color: #ff9800;
            margin-top: 8px;
            font-weight: bold;
        }
        .success-text {
            font-size: 12px;
            color: #4caf50;
            margin-top: 8px;
            font-weight: bold;
            display: none;
        }
    </style>
</head>
<body>

    <div class="header-container">
        <div class="app-title">YOU MONEY</div>
        <div class="wallet-small">₹ <span id="money-display">0.00</span></div>
    </div>

    <div class="container">
        
        <!-- नया सर्च बॉक्स फीचर -->
        <div class="search-box-container">
            <p class="search-title">🔍 यूट्यूब वीडियो लिंक सर्च करें</p>
            <div class="search-row">
                <input type="text" id="youtube-url" class="search-input" placeholder="यहाँ वीडियो लिंक पेस्ट करें...">
                <button class="search-btn" onclick="loadSearchedVideo()">सर्च करें</button>
            </div>
        </div>

        <!-- वीडियो प्लेयर कार्ड -->
        <div class="video-card">
            <p class="video-title" id="display-title">वीडियो: टास्क पूरा करें (₹0.01 कमाएं)</p>
            <div class="video-wrapper">
                <div id="main-player"></div>
            </div>
            <div id="main-status" class="status-text">स्थिति: वीडियो लिंक सर्च करके प्ले करें...</div>
            <div id="main-success" class="success-text">✅ ₹0.01 आपके वॉलेट में जोड़ दिए गए हैं!</div>
        </div>

    </div>

    <script>
        let currentBalance = 0.00;
        let currentVideoId = 'tgbNymZ7vqY'; // शुरुआती डिफ़ॉल्ट वीडियो
        let isRewarded = false;
        let player;

        // यूट्यूब API लोड करना
        let tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        let firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('main-player', {
                videoId: currentVideoId,
                events: {
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        // लिंक में से Video ID निकालने का फंक्शन
        function extractVideoId(url) {
            let regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            let match = url.match(regExp);
            return (match && match[2].length == 11) ? match[2] : null;
        }

        // नया वीडियो लोड करने का फंक्शन
        function loadSearchedVideo() {
            let urlInput = document.getElementById('youtube-url').value;
            let vId = extractVideoId(urlInput);

            if (vId) {
                currentVideoId = vId;
                isRewarded = false; // नए वीडियो के लिए रिवॉर्ड रीसेट करें
                document.getElementById('main-success').style.display = 'none';
                document.getElementById('main-status').style.display = 'block';
                document.getElementById('main-status').innerText = "स्थिति: नया वीडियो लोड हो गया। पूरा देखें...";
                document.getElementById('main-status').style.color = "#ff9800";
                
                // प्लेयर में नया वीडियो डालें
                player.loadVideoById(currentVideoId);
            } else {
                alert("कृपया सही यूट्यूब वीडियो लिंक पेस्ट करें!");
            }
        }

        // ट्रैकर चेकिंग सिस्टम
        function onPlayerStateChange(event) {
            let statusElement = document.getElementById('main-status');
            
            if (event.data == YT.PlayerState.PLAYING) {
                statusElement.innerText = "status: वीडियो चल रहा है... (पूरा देखना ज़रूरी है)";
                statusElement.style.color = "#4caf50";
            } 
            else if (event.data == YT.PlayerState.PAUSED) {
                statusElement.innerText = "status: वीडियो रुका हुआ है! देखने पर ही पैसा मिलेगा।";
                statusElement.style.color = "#ff9800";
            } 
            else if (event.data == YT.PlayerState.ENDED) {
                statusElement.style.display = 'none';
                
                if (!isRewarded) {
                    isRewarded = true;
                    currentBalance += 0.01;
                    document.getElementById('money-display').innerText = currentBalance.toFixed(2);
                    document.getElementById('main-success').style.display = 'block';
                }
            }
        }
    </script>
</body>
</html>
